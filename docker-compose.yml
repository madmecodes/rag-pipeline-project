services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]

  api:
    build: .
    depends_on: [qdrant]
    ports: ["8000:8000"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./logs:/app/logs

volumes:
  qdrant:
