[project]
name = "rag-pipeline-project"
version = "0.1.0"
description = "Production-style RAG over IT support tickets: hybrid search, reranking, ACLs, guardrails, eval"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "qdrant-client[fastembed]>=1.12",
    "fastembed>=0.4",
    "openai>=1.50",
    "pandas>=2.2",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
